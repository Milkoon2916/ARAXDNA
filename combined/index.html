<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAXDNA — 지문 하나로 구문분석 + OX 워크북</title>
<style>
  :root{
    --ink:#241220;
    --paper:#fff7fb;
    --rule:#f6cfe3;
    --pink:#ff2e93;
    --pink-dark:#c40067;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif KR","Georgia",serif;}
  .wrap{max-width:820px;margin:0 auto;padding:48px 24px 96px;}
  .eyebrow{font-family:"Courier New",monospace;font-size:12px;letter-spacing:.12em;color:var(--pink-dark);text-transform:uppercase;margin:0 0 12px;}
  h1{font-size:clamp(24px,5vw,36px);margin:0 0 12px;}
  p.lead{font-size:15px;line-height:1.7;color:#5b4a56;margin:0 0 28px;}
  label{display:block;font-family:"Courier New",monospace;font-size:12px;color:var(--pink-dark);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em;}
  input[type=text], input[type=password], input[type=number], textarea, select{
    width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;
    font-family:inherit;font-size:14px;background:var(--card);color:var(--ink);
  }
  textarea{min-height:120px;resize:vertical;}
  .toggle{font-family:"Courier New",monospace;font-size:12px;color:var(--pink-dark);cursor:pointer;margin-top:4px;display:inline-block;}
  .global-row{display:flex;gap:16px;}
  .global-row > div{flex:1;}
  @media (max-width:600px){.global-row{flex-direction:column;}}

  .passage-block{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px 18px 6px;margin-top:16px;position:relative;}
  .passage-block .block-title{font-family:"Courier New",monospace;font-size:12px;font-weight:bold;color:var(--pink-dark);margin-bottom:4px;}
  .remove-btn{position:absolute;top:14px;right:14px;background:none;border:none;color:#a68a9c;font-size:13px;cursor:pointer;font-family:"Courier New",monospace;}

  .char-counter{font-family:"Courier New",monospace;font-size:11px;color:#a68a9c;text-align:right;margin-top:4px;}
  .char-counter.warn{color:#c47a00;}
  .char-counter.danger{color:var(--pink-dark);font-weight:bold;}

  #addPassage{
    margin-top:14px;width:100%;padding:10px;border:1.5px dashed var(--rule);border-radius:6px;
    background:none;color:var(--pink-dark);font-family:"Courier New",monospace;font-size:13px;cursor:pointer;
  }
  #addPassage:disabled{opacity:.4;cursor:default;}

  button#go{
    margin-top:28px;width:100%;padding:14px;border:none;border-radius:6px;
    background:var(--pink);color:#fff;font-family:"Courier New",monospace;font-size:14px;
    font-weight:bold;letter-spacing:.04em;cursor:pointer;
  }
  button#go:disabled{opacity:.5;cursor:default;}
  .status{margin-top:16px;font-size:13px;color:#5b4a56;min-height:1.2em;white-space:pre-line;}
  .err{margin-top:8px;font-size:13px;color:var(--pink-dark);display:none;white-space:pre-line;}

  .results{margin-top:40px;display:none;}
  .result-card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:20px;margin-bottom:20px;}
  .result-card h3{margin:0 0 8px;font-size:16px;}
  .result-card p{font-size:13px;color:#6b5a66;margin:0 0 14px;}
  .result-card a.dl{display:inline-block;font-family:"Courier New",monospace;font-size:13px;color:var(--pink-dark);font-weight:bold;}

  /* ---- OX 워크북 시트 스타일 (원본 comprehension 도구 이식) ---- */
  .ox-body{border-top:1px solid var(--rule);padding-top:14px;margin-top:10px;}
  .ox-stamp{display:inline-block;border:2px solid var(--pink);color:var(--pink-dark);font-family:"Courier New",monospace;font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:20px;transform:rotate(-3deg);margin-bottom:12px;}
  .ox-title-kr{font-size:19px;margin:0 0 2px;font-weight:700;}
  .ox-title-en{font-size:13px;color:#6b5a66;margin:0 0 14px;font-style:italic;}
  .ox-instr{font-size:13px;font-weight:bold;margin:18px 0 8px;}
  .ox-passage-box{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;font-size:13.5px;line-height:1.7;}
  .ox-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:13.5px;line-height:1.55;}
  .ox-row:last-child{border-bottom:none;}
  .ox-row.en{font-style:italic;}
  .ox-num{color:var(--pink-dark);font-weight:bold;font-family:"Courier New",monospace;flex:0 0 24px;}
  .ox-pick{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start;margin-left:auto;padding-left:10px;}
  .ox-pick button{width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);background:#fff;cursor:pointer;font-size:11px;font-family:"Courier New",monospace;}
  .ox-pick button.picked-o{background:#ffe3f1;border-color:var(--pink);color:var(--pink-dark);}
  .ox-pick button.picked-x{background:#ffe3f1;border-color:var(--pink-dark);color:var(--pink-dark);}
  .ox-toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .ox-toolbar button{background:none;border:1px solid var(--rule);border-radius:6px;padding:8px 14px;font-family:"Courier New",monospace;font-size:12px;cursor:pointer;color:var(--ink);}
  .ox-toolbar button:hover{border-color:var(--pink);color:var(--pink-dark);}
  .ox-key{display:none;margin-top:14px;padding:14px 16px;background:var(--paper);border:1px dashed var(--rule);border-radius:6px;}
  .ox-key.show{display:block;}
  .ox-key h4{font-size:15px;font-weight:700;margin:0 0 4px;}
  .ox-key .key-sub{font-size:11px;color:#a68a9c;margin:0 0 12px;font-family:"Courier New",monospace;}
  .ox-key-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px 6px;font-family:"Courier New",monospace;font-size:12px;}
  .ox-key-grid b{color:var(--pink-dark);margin-right:4px;}

</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">ARAXDNA · batch</p>
  <h1>지문 여러 개로 구문분석 + OX 워크북</h1>
  <p class="lead">지문을 최대 5개까지 한 번에 넣으면, 구문분석은 <b>PDF 한 개</b>로 합쳐서,
    OX 워크북은 지문별로 만들어드립니다. 각 워크북 카드에서 "인쇄 / PDF 저장" 버튼을 누르면
    그 워크북만 인쇄 대화상자를 통해 PDF로 저장할 수 있어요.
    Google Gemini API 키 하나만 있으면 됩니다
    (<a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--pink-dark)">무료 발급</a>).
    키는 이 브라우저에만 저장되고 서버로는 전송되지 않습니다.</p>

  <label>Gemini API 키</label>
  <input type="password" id="apiKey" placeholder="AIza...">
  <span class="toggle" id="toggleKey">키 표시/숨기기</span>

  <div class="global-row">
    <div>
      <label>한글 OX 문항 수 (지문당)</label>
      <input type="number" id="numKo" value="10" min="1" max="20">
    </div>
    <div>
      <label>영어 OX 문항 수 (지문당)</label>
      <input type="number" id="numEn" value="5" min="1" max="20">
    </div>
  </div>

  <label>Gemini 모델</label>
  <select id="modelSelect">
    <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (가볍고 무료 등급 친화적)</option>
    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (더 빠르고 저렴한 최신 경량 모델)</option>
    <option value="gemini-3.6-flash">Gemini 3.6 Flash (품질 가장 좋음, 결제 등록 권장)</option>
  </select>

  <div id="passageList"></div>
  <button id="addPassage" type="button">+ 지문 추가 (최대 5개)</button>

  <button id="go">분석 + 워크북 생성하기</button>
  <div class="status" id="status"></div>
  <div class="err" id="err"></div>

  <div class="results" id="results">
    <div class="result-card" id="pdfCard">
      <h3>구문분석 PDF (지문 전체 합본)</h3>
      <p id="pdfStatus">대기 중...</p>
    </div>
    <div id="oxContainer"></div>
  </div>
</div>

<script>
const MAX_PASSAGES = 5;
const apiKeyEl = document.getElementById('apiKey');
const KEY_STORAGE = 'araxdna-gemini-key';
apiKeyEl.value = localStorage.getItem(KEY_STORAGE) || '';
apiKeyEl.addEventListener('input', () => localStorage.setItem(KEY_STORAGE, apiKeyEl.value.trim()));
document.getElementById('toggleKey').addEventListener('click', () => {
  apiKeyEl.type = apiKeyEl.type === 'password' ? 'text' : 'password';
});

const passageList = document.getElementById('passageList');
const addBtn = document.getElementById('addPassage');
let passageCount = 0;

function addPassageBlock(){
  if (passageCount >= MAX_PASSAGES) return;
  passageCount++;
  const idx = passageCount;
  const block = document.createElement('div');
  block.className = 'passage-block';
  block.dataset.idx = idx;
  block.innerHTML = `
    <button type="button" class="remove-btn">삭제</button>
    <div class="block-title">지문 ${idx}</div>
    <label>지문 출처 (선택)</label>
    <input type="text" class="p-source" placeholder="예: 2024 수능 33번, 자체 제작">
    <label>지문 본문</label>
    <textarea class="p-text" placeholder="여기에 영어 지문을 붙여넣으세요"></textarea>
    <div class="char-counter">0자 · 약 0문장 · 안전</div>
    <label>목표 어법 (선택)</label>
    <input type="text" class="p-grammar" placeholder="예: 가정법 도치, 분사구문">
  `;
  block.querySelector('.remove-btn').addEventListener('click', () => {
    block.remove();
    renumberBlocks();
  });
  const textarea = block.querySelector('.p-text');
  const counter = block.querySelector('.char-counter');
  textarea.addEventListener('input', () => updateCounter(textarea, counter));
  passageList.appendChild(block);
  renumberBlocks();
}

function updateCounter(textarea, counter){
  const text = textarea.value;
  const chars = text.length;
  const actualSentences = text.trim() ? splitSentences(text).length : 0;
  let level = 'safe', label = '안전';
  if (chars > 12000) { level = 'danger'; label = '너무 길어요 — 지문을 나눠서 넣는 걸 권장'; }
  else if (chars > 6000) { level = 'warn'; label = '다소 김 — 결과가 잘리면 지문을 나눠보세요'; }
  counter.className = 'char-counter' + (level === 'safe' ? '' : ' ' + level);
  counter.textContent = `${chars.toLocaleString()}자 · ${actualSentences}문장으로 인식됨 · ${label}`;
}

function renumberBlocks(){
  const blocks = [...passageList.querySelectorAll('.passage-block')];
  passageCount = blocks.length;
  blocks.forEach((b, i) => { b.dataset.idx = i + 1; b.querySelector('.block-title').textContent = `지문 ${i + 1}`; });
  addBtn.disabled = passageCount >= MAX_PASSAGES;
  addBtn.textContent = passageCount >= MAX_PASSAGES ? '최대 5개까지 추가할 수 있어요' : '+ 지문 추가 (최대 5개)';
}

addBtn.addEventListener('click', addPassageBlock);
addPassageBlock(); // 최소 1개는 기본으로 보여줌

function stripCodeFence(text){
  let t = text.trim();
  if (t.startsWith('```')) t = t.replace(/^```(json)?/, '').replace(/```$/, '').trim();
  return t;
}

// 지문을 실제로 문장 단위 배열로 쪼갬 (흔한 약어의 마침표는 문장 끝으로 취급하지 않음).
// 이렇게 미리 나눈 목록을 프롬프트에 [번호]로 그대로 넘겨서, 모델이 "몇 문장인지 스스로 세는"
// 일 자체를 하지 않게 만든다 -- 개수가 틀릴 여지를 원천적으로 없앰.
function splitSentences(text){
  // 1단계: 소제목처럼 마침표 없이 끝나는 짧은 줄(헤딩)은 문장 추출에서 제외 -- 다음 문장에 들러붙는 걸 방지
  const lines = text.split(/\n/);
  const contentLines = lines.filter(line => {
    const trimmed = line.trim();
    if (trimmed.length === 0) return false;
    const endsLikeSentence = /[.!?"'\)\]]\s*$/.test(trimmed);
    const looksLikeHeading = !endsLikeSentence && trimmed.length < 60 && trimmed.split(/\s+/).length <= 8;
    return !looksLikeHeading;
  });
  const cleaned = contentLines.join(' ');

  // 2단계: 약어/소수점 보호 (단어 경계 기준 -- "deal.", "total." 같은 오탐 방지)
  const abbrevs = ['Mr','Mrs','Ms','Dr','Prof','St','vs','e\\.g','i\\.e','etc','U\\.S','U\\.K','a\\.m','p\\.m','Jr','Sr','Inc','Co','Ltd','approx','cf','al'];
  let t = cleaned.trim();
  abbrevs.forEach(a => {
    const re = new RegExp('\\b' + a + '\\.', 'g');
    t = t.replace(re, a.replace(/\\/g, '') + '§');
  });
  t = t.replace(/(\d)\.(\d)/g, '$1§$2');

  // 3단계: 문장 경계 후보 뒤 글자가 소문자면(인용문 뒤 문장이 이어지는 경우) 진짜 끝이
  // 아니라고 보고 앞 조각에 이어붙임 -- 예: "Don't argue!" message. 를 한 문장으로 유지
  const raw = t.match(/[^.!?]+[.!?]+(?:['")\]]*)?\s*/g) || [t];
  const merged = [];
  for (const piece of raw) {
    const trimmedPiece = piece.trim();
    if (merged.length > 0 && /^[a-z]/.test(trimmedPiece)) {
      merged[merged.length - 1] += ' ' + trimmedPiece;
      continue;
    }
    merged.push(trimmedPiece);
  }
  return merged.map(s => s.replace(/§/g, '.').trim()).filter(s => s.length > 0);
}

// ---- 구문분석 (지문 1개당 1번 호출, 결과를 모아서 PDF 1개로 합침) ----
async function callGeminiForAnalysis(apiKey, systemPrompt, model, maxTokens, passageText, passageIndex, source, targetGrammar, responseJsonSchema, sentenceList){
  const lines = [`다음 지문을 분석해줘 (지문 번호: ${passageIndex}):`];
  if (source && source.trim()) lines.push(`지문 출처: ${source.trim()}`);
  if (targetGrammar && targetGrammar.trim()) lines.push(`목표 어법: ${targetGrammar.trim()}`);
  lines.push('');
  lines.push(`이 지문은 정확히 ${sentenceList.length}개의 문장으로 미리 나뉘어 있습니다. 아래 [번호]를 그대로 sentences 배열의 순서·개수·num 값으로 쓰세요. 절대 합치거나 쪼개지 마세요:`);
  sentenceList.forEach((s, i) => lines.push(`[${i + 1}] ${s}`));
  lines.push('');
  lines.push('원문 전체 (참고용, 번역·문맥 파악에 활용):');
  lines.push(passageText.trim());
  const userMessage = lines.join('\n');

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemPrompt }] },
      contents: [{ role: 'user', parts: [{ text: userMessage }] }],
      generationConfig: {
        maxOutputTokens: maxTokens,
        responseMimeType: 'application/json',
        responseJsonSchema,
        thinkingConfig: { thinkingBudget: 2048 }
      }
    })
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody?.error?.message || `Gemini API 오류 (${res.status})`);
  }
  const data = await res.json();
  const candidate = data.candidates?.[0];
  if (!candidate) throw new Error('Gemini가 응답을 반환하지 않았습니다. (안전 필터 등으로 차단되었을 수 있어요)');
  const rawText = candidate.content.parts.filter(p => p.text).map(p => p.text).join('');
  const parsed = JSON.parse(stripCodeFence(rawText));
  return parsed.passages ? parsed.passages[0] : parsed;
}

async function analyzeOnePassageWithRetry(apiKey, systemPrompt, model, maxTokens, passageText, passageIndex, source, targetGrammar, responseJsonSchema, onStatus){
  const sentenceList = splitSentences(passageText);
  const expected = sentenceList.length;
  let result = await callGeminiForAnalysis(apiKey, systemPrompt, model, maxTokens, passageText, passageIndex, source, targetGrammar, responseJsonSchema, sentenceList);
  let actual = result.sentences ? result.sentences.length : 0;

  if (actual !== expected) {
    onStatus(`지문 ${passageIndex}: 문장 수가 안 맞아요 (실제 ${expected}문장 / 분석 ${actual}문장) — 다시 시도하는 중...`);
    result = await callGeminiForAnalysis(apiKey, systemPrompt, model, maxTokens, passageText, passageIndex, source, targetGrammar, responseJsonSchema, sentenceList);
    actual = result.sentences ? result.sentences.length : 0;
  }

  result._sentenceCheck = { expected, actual, ok: actual === expected };
  return result;
}

async function runPassageAnalysisBatch(apiKey, model, passages){
  const pdfStatus = document.getElementById('pdfStatus');
  const pdfCard = document.getElementById('pdfCard');
  pdfStatus.textContent = '분석 설정을 불러오는 중...';
  const cfgRes = await fetch('/prompt-config');
  if (!cfgRes.ok) throw new Error('서버에서 프롬프트 설정을 가져오지 못했습니다.');
  const cfg = await cfgRes.json();

  const analyzed = [];
  const warnings = [];
  for (let i = 0; i < passages.length; i++) {
    const p = passages[i];
    pdfStatus.textContent = `지문 ${i + 1}/${passages.length} 분석 중… (20~90초씩 걸릴 수 있어요)`;
    const result = await analyzeOnePassageWithRetry(
      apiKey, cfg.system_prompt, model, cfg.max_tokens, p.text, i + 1, p.source, p.grammar, cfg.response_json_schema,
      (msg) => { pdfStatus.textContent = msg; }
    );
    if (!result._sentenceCheck.ok) {
      warnings.push(`지문 ${i + 1}(${p.source || '출처 없음'}): 재시도 후에도 문장 수가 안 맞아요 (지문 ${result._sentenceCheck.expected}문장 / 분석 ${result._sentenceCheck.actual}문장). PDF에서 직접 확인해주세요.`);
    }
    delete result._sentenceCheck;
    result.passage_index = i + 1;
    if (p.source && p.source.trim()) result.source = p.source.trim();
    analyzed.push(result);
    if (i < passages.length - 1) await new Promise(r => setTimeout(r, 1500));
  }

  pdfStatus.textContent = 'PDF로 합쳐서 렌더링하는 중...';
  const renderRes = await fetch('/render', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ passages: analyzed })
  });
  if (!renderRes.ok) {
    const err = await renderRes.json().catch(() => ({}));
    throw new Error(err.detail ? JSON.stringify(err.detail) : `렌더링 서버 오류 (${renderRes.status})`);
  }
  const renderData = await renderRes.json();
  pdfCard.querySelector('p').remove();
  const link = document.createElement('a');
  link.className = 'dl';
  link.href = renderData.download_url;
  link.target = '_blank';
  link.textContent = `📄 PDF 다운로드 (지문 ${passages.length}개 합본)`;
  pdfCard.appendChild(link);
  if (warnings.length > 0) {
    const warnEl = document.createElement('p');
    warnEl.style.cssText = 'margin-top:10px;font-size:12px;color:var(--pink-dark);white-space:pre-line;';
    warnEl.textContent = '⚠ ' + warnings.join('\n⚠ ');
    pdfCard.appendChild(warnEl);
  }
}

// ---- OX 워크북 (지문마다 개별 생성, 원본 comprehension 도구의 워크시트 스타일 + 인쇄/PDF 기능 이식) ----
function buildOxSystemPrompt(numKo, numEn){
  const total = numKo + numEn;
  const lastKo = String(numKo).padStart(2,'0');
  const firstEn = numKo + 1;
  const lastEn = total;
  return `You generate a Korean EFL reading-comprehension worksheet from a passage the user supplies, in the exact style used by Korean English-academy workbooks (like Hackers).

Produce exactly ${total} O/X (true/false) comprehension items about the passage, split into two groups:

GROUP A (items 01-${lastKo}, exactly ${numKo} items, written in KOREAN):
- One item per sentence/idea in the passage, in passage order.
- Each item paraphrases one sentence in different Korean wording -- never a near-literal translation.
- Mix true and false roughly 50/50 via negation, a swapped comparison, an added absolute word ("모든","전혀","항상"), or a swapped attribute.

GROUP B (items ${firstEn}-${lastEn}, exactly ${numEn} items, written in ENGLISH):
- Each item combines 2+ facts from different sentences, or restates the passage's overall claim/exception.
- Still answerable purely from the passage text.

Rules for both groups:
- Never require outside knowledge not in the passage.
- Balance O and X answers roughly evenly within each group.
- Output ONLY valid JSON, no markdown code fences, no commentary before or after:
{"titleKo": "짧은 한글 제목", "titleEn": "Short English title", "groupA": [{"num":"01","text":"...","answer":"O"}], "groupB": [{"num":"${firstEn}","text":"...","answer":"O"}]}
groupA must have exactly ${numKo} items numbered 01-${lastKo}. groupB must have exactly ${numEn} items numbered ${firstEn}-${lastEn}.`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function runOxForOnePassage(apiKey, model, passageText, numKo, numEn){
  const system = buildOxSystemPrompt(numKo, numEn);
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: passageText }] }]
    })
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data?.error?.message || 'API 요청이 실패했습니다.');
  let text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  text = stripCodeFence(text);
  return JSON.parse(text);
}

function itemRow(it, isEn){
  return `<div class="ox-row${isEn ? ' en' : ''}">
    <span class="ox-num">${it.num}</span>
    <span>${escapeHtml(it.text)}</span>
    <span class="ox-pick">
      <button type="button" class="pick-btn" data-choice="o">O</button>
      <button type="button" class="pick-btn" data-choice="x">X</button>
    </span>
  </div>`;
}

function buildOxSheetHtml(parsed, passageText, source){
  const koRange = `01~${parsed.groupA[parsed.groupA.length - 1].num}`;
  const enRange = `${parsed.groupB[0].num}~${parsed.groupB[parsed.groupB.length - 1].num}`;
  const items = [...parsed.groupA, ...parsed.groupB];

  let html = '<div class="ox-body">';
  if (source) html += `<span class="ox-stamp">${escapeHtml(source)}</span>`;
  html += `<div class="ox-title-kr">${escapeHtml(parsed.titleKo)}</div>`;
  html += `<div class="ox-title-en">${escapeHtml(parsed.titleEn)}</div>`;
  html += `<div class="ox-instr">다음 글을 읽고 물음에 답하시오.</div>`;
  html += `<div class="ox-passage-box">${escapeHtml(passageText)}</div>`;
  html += `<div class="ox-instr">${koRange}&nbsp;&nbsp;글의 내용과 일치하면 O, 일치하지 않으면 X를 고르시오.</div>`;
  parsed.groupA.forEach(it => { html += itemRow(it, false); });
  html += `<div class="ox-instr">${enRange}&nbsp;&nbsp;Choose O if the statement matches the passage, or X if it does not.</div>`;
  parsed.groupB.forEach(it => { html += itemRow(it, true); });
  html += `<div class="ox-toolbar">
    <button type="button" class="key-toggle-btn">정답 보기 / 숨기기</button>
    <button type="button" class="dl-btn">📄 PDF 다운로드</button>
  </div>
  <p class="dl-status" style="font-size:12px;color:#5b4a56;margin-top:4px;"></p>`;
  html += `<div class="ox-key">
    <h4>정답 (Answer Key)</h4>
    <p class="key-sub">${source ? escapeHtml(source) + ' · ' : ''}${escapeHtml(parsed.titleKo)}</p>
    <div class="ox-key-grid">${items.map(it => `<span><b>${it.num}</b>${it.answer}</span>`).join('')}</div>
  </div>`;
  html += '</div>';
  return html;
}

function wireOxCard(card, parsed, passageText, source){
  card.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const wrap = btn.parentElement;
      [...wrap.children].forEach(b => b.classList.remove('picked-o', 'picked-x'));
      btn.classList.add(btn.dataset.choice === 'o' ? 'picked-o' : 'picked-x');
    });
  });
  const keyToggle = card.querySelector('.key-toggle-btn');
  if (keyToggle) keyToggle.addEventListener('click', () => {
    card.querySelector('.ox-key').classList.toggle('show');
  });
  const dlBtn = card.querySelector('.dl-btn');
  const dlStatus = card.querySelector('.dl-status');
  if (dlBtn) dlBtn.addEventListener('click', async () => {
    dlBtn.disabled = true;
    dlStatus.textContent = 'PDF 생성 중...';
    try {
      const payload = {
        titleKo: parsed.titleKo,
        titleEn: parsed.titleEn,
        groupA: parsed.groupA,
        groupB: parsed.groupB,
        passage: passageText,
        source: source || null
      };
      const res = await fetch('/render-comprehension', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail ? JSON.stringify(err.detail) : `렌더링 서버 오류 (${res.status})`);
      }
      const data = await res.json();
      dlStatus.textContent = '';
      const a = document.createElement('a');
      a.href = data.download_url;
      a.target = '_blank';
      a.click();
    } catch (e) {
      dlStatus.textContent = '오류: ' + e.message;
    } finally {
      dlBtn.disabled = false;
    }
  });
}

async function runOxBatch(apiKey, model, passages, numKo, numEn){
  const oxContainer = document.getElementById('oxContainer');
  oxContainer.innerHTML = '';
  for (let i = 0; i < passages.length; i++) {
    const p = passages[i];
    const card = document.createElement('div');
    card.className = 'result-card';
    const label = p.source && p.source.trim() ? p.source.trim() : `지문 ${i + 1}`;
    card.innerHTML = `<h3>OX 워크북 — ${escapeHtml(label)}</h3><p class="ox-status">생성 중…</p>`;
    oxContainer.appendChild(card);

    try {
      const parsed = await runOxForOnePassage(apiKey, model, p.text, numKo, numEn);
      card.querySelector('.ox-status').remove();
      const src = p.source && p.source.trim() ? p.source.trim() : '';
      card.insertAdjacentHTML('beforeend', buildOxSheetHtml(parsed, p.text, src));
      wireOxCard(card, parsed, p.text, src);
    } catch (e) {
      card.querySelector('.ox-status').textContent = '오류: ' + e.message;
    }
    if (i < passages.length - 1) await new Promise(r => setTimeout(r, 1500));
  }
}

document.getElementById('go').addEventListener('click', async () => {
  const apiKey = apiKeyEl.value.trim();
  const model = document.getElementById('modelSelect').value;
  const numKo = parseInt(document.getElementById('numKo').value, 10) || 10;
  const numEn = parseInt(document.getElementById('numEn').value, 10) || 5;
  const statusEl = document.getElementById('status');
  const errEl = document.getElementById('err');
  const goBtn = document.getElementById('go');

  const blocks = [...passageList.querySelectorAll('.passage-block')];
  const passages = blocks.map(b => ({
    source: b.querySelector('.p-source').value,
    text: b.querySelector('.p-text').value.trim(),
    grammar: b.querySelector('.p-grammar').value,
  })).filter(p => p.text.length > 0);

  errEl.style.display = 'none';
  if (!apiKey) { errEl.textContent = 'Gemini API 키를 입력해주세요.'; errEl.style.display = 'block'; return; }
  if (passages.length === 0) { errEl.textContent = '지문을 최소 1개는 입력해주세요.'; errEl.style.display = 'block'; return; }
  if (passages.length > MAX_PASSAGES) { errEl.textContent = `지문은 최대 ${MAX_PASSAGES}개까지만 가능해요.`; errEl.style.display = 'block'; return; }

  goBtn.disabled = true;
  statusEl.textContent = `지문 ${passages.length}개를 순서대로 처리합니다. 시간이 좀 걸릴 수 있어요...`;
  document.getElementById('results').style.display = 'block';

  const [pdfResult, oxResult] = await Promise.allSettled([
    runPassageAnalysisBatch(apiKey, model, passages),
    runOxBatch(apiKey, model, passages, numKo, numEn),
  ]);

  if (pdfResult.status === 'rejected') {
    document.getElementById('pdfStatus').textContent = '오류: ' + pdfResult.reason.message;
  }
  statusEl.textContent = (pdfResult.status === 'fulfilled') ? '모두 완료되었습니다!' : '일부 작업에서 오류가 발생했습니다. 위를 확인해주세요.';
  goBtn.disabled = false;
});
</script>
